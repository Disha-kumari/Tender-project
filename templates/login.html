<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MRPL Tender Commercial Evaluation System</title>

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
          rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

    <!-- CSS -->
    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body>

<div class="background-overlay"></div>

<div class="container">

    <!-- LEFT PANEL -->

    <div class="left-panel">

        <img src="{{ url_for('static', filename='images/mrpl_logo.png') }}"
             class="logo"
             alt="MRPL Logo">

        <h1>

            MRPL Tender

            <br>

            <span>Commercial</span>

            <br>

            <span>Evaluation</span>

            <br>

            System

        </h1>

        <p>

            Smart, Transparent and Efficient Tender Evaluation Platform

        </p>

    </div>

    <!-- LOGIN CARD -->

    <div class="login-card">

        <h2>Welcome Back</h2>

        <p>Sign in to continue</p>

        <!-- Error Message -->

        {% if error %}

        <div class="error-message">

            {{ error }}

        </div>

        {% endif %}

        <!-- LOGIN FORM -->

        <form action="{{ url_for('login') }}" method="POST">

            <!-- USERNAME -->

            <div class="input-box">

                <i class="fa-solid fa-user"></i>

                <input
                    type="text"
                    name="username"
                    placeholder="Username"
                    required>

            </div>

            <!-- PASSWORD -->

            <div class="input-box">

                <i class="fa-solid fa-lock"></i>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Password"
                    required>

                <i class="fa-solid fa-eye"
                   id="togglePassword"></i>

            </div>

            <!-- OPTIONS -->

            <div class="options">

                <label>

                    <input type="checkbox">

                    Remember Me

                </label>

                <a href="#">

                    Forgot Password?

                </a>

            </div>

            <!-- LOGIN BUTTON -->

            <button type="submit">

                LOGIN

                <i class="fa-solid fa-arrow-right"></i>

            </button>

        </form>

        <div class="footer">

            © 2026 Mangalore Refinery & Petrochemicals Limited

        </div>

    </div>

</div>

<script>

const togglePassword = document.getElementById("togglePassword");

const password = document.getElementById("password");

togglePassword.addEventListener("click", function(){

    if(password.type==="password"){

        password.type="text";

        this.classList.remove("fa-eye");

        this.classList.add("fa-eye-slash");

    }

    else{

        password.type="password";

        this.classList.remove("fa-eye-slash");

        this.classList.add("fa-eye");

    }

});

</script>

</body>

</html>
